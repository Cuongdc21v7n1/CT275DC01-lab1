<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Biểu mẫu đăng nhập</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5 text-center">
  <h3>Mở biểu mẫu đăng nhập</h3>
  <button type="button" class="btn btn-info" data-toggle="modal" data-target="#loginModal">
    Mở hộp thoại
  </button>
</div>

<!-- Modal -->
<div class="modal fade" id="loginModal" tabindex="-1" role="dialog" aria-labelledby="loginModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="loginModalLabel"><i class="fa fa-lock"></i> Đăng nhập</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Đóng">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <div class="modal-body">
        <form>
          <div class="form-group">
            <label for="username">Người dùng:</label>
            <input type="text" class="form-control" id="username" placeholder="Tên người dùng">
          </div>
          <div class="form-group">
            <label for="password">Mật khẩu:</label>
            <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu">
          </div>
          <div class="form-check mb-2">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <label class="form-check-label" for="rememberMe">Ghi nhớ tôi</label>
          </div>
        </form>
      </div>

      <div class="modal-footer d-flex justify-content-between w-100">
        <button type="button" class="btn btn-danger" data-dismiss="modal">Hủy bỏ</button>
        <button type="submit" class="btn btn-success">Đăng nhập</button>
      </div>

      <div class="text-center mb-3">
        <a href="#">Bạn chưa phải là thành viên? <strong>Đăng ký</strong></a><br>
        <a href="#">Quên mật khẩu?</a>
      </div>

    </div>
  </div>
</div>

<!-- Bootstrap JS & jQuery -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Font Awesome for lock icon (optional) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

</body>
</html>
