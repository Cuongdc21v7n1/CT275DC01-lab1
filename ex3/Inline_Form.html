<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Biểu mẫu đăng nhập dạng một dòng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .input-group {
      width: 220px;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <div class="card">
      <div class="card-header bg-primary text-white">
        Biểu mẫu đăng nhập
      </div>
      <div class="card-body">
        <form class="d-flex align-items-center gap-3 flex-wrap">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
            <input type="email" class="form-control" placeholder="Nhập vào email">
          </div>

          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" class="form-control" placeholder="Nhập vào mật khẩu">
          </div>

          <div class="form-check d-flex align-items-center mb-0">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label ms-1" for="rememberMe">Ghi nhớ tôi</label>
          </div>

          <button type="submit" class="btn btn-primary">Đăng nhập</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
