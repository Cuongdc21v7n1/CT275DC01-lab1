<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Biểu mẫu đăng nhập</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>
<body>

<div class="container" style="margin-top: 50px; max-width: 500px;">
  <div class="panel panel-info">
    <div class="panel-heading">
      <h3 class="panel-title">Biểu mẫu đăng nhập</h3>
    </div>
    <div class="panel-body">
      <form class="form-horizontal">
        <div class="form-group">
          <label for="email" class="col-sm-3 control-label"><strong>Email:</strong></label>
          <div class="col-sm-9">
            <input type="email" class="form-control" id="email" placeholder="Nhập vào email">
          </div>
        </div>
        <div class="form-group">
          <label for="password" class="col-sm-3 control-label"><strong>Mật khẩu:</strong></label>
          <div class="col-sm-9">
            <input type="password" class="form-control" id="password" placeholder="Nhập vào mật khẩu">
          </div>
        </div>
        <div class="form-group">
          <div class="col-sm-offset-3 col-sm-9">
            <div class="checkbox">
              <label>
                <input type="checkbox"> Ghi nhớ tôi
              </label>
            </div>
          </div>
        </div>
        <div class="form-group">
          <div class="col-sm-offset-3 col-sm-9">
            <button type="submit" class="btn btn-primary">Đăng nhập</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

</body>
</html>
